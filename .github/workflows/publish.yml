name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must match package.json"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Configure this environment in GitHub with required reviewers. The job
    # waits for approval before npm publish runs.
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install -g npm@11.12.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke:mcp
      - run: pnpm validate:package
      - name: Verify package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e "const p = require('./package.json'); if (p.version !== process.env.RELEASE_VERSION) { console.error('package.json version', p.version, 'does not match', process.env.RELEASE_VERSION); process.exit(1); }"
      - name: Verify release tag points at HEAD
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git fetch --tags --force
          test "$(git rev-parse "v$RELEASE_VERSION")" = "$(git rev-parse HEAD)"
      - run: npm publish --provenance --access public
