name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: exactly_once
          POSTGRES_PASSWORD: exactly_once
          POSTGRES_DB: exactly_once
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U exactly_once -d exactly_once"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://exactly_once:exactly_once@localhost:5433/exactly_once
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm build
      - run: pnpm validate:package
