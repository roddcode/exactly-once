name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate:package

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        postgres: [14, 16, 17]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: exactly_once
          POSTGRES_PASSWORD: exactly_once
          POSTGRES_DB: exactly_once
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U exactly_once -d exactly_once"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://exactly_once:exactly_once@localhost:5433/exactly_once
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Full suite with coverage (primary combo)
        if: matrix.node == 22 && matrix.postgres == 16
        run: pnpm test:coverage
      - name: Full suite
        if: matrix.node != 22 || matrix.postgres != 16
        run: pnpm test:db
